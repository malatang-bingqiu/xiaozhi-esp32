name: Build Waveshare ESP32-S3-RLCD-4.2

on:
  push:
    branches:
      - main
      - ci/*
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py -DBOARD_NAME=waveshare-s3-rlcd-4.2 build
          idf.py merge-bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: waveshare-s3-rlcd-4.2-${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
